name: release

# Auto-build cross-platform binaries + create a GitHub Release with assets
# whenever a tag like v0.2.1 is pushed.
#
# Trigger flow:
#   1. Bump version in CHANGELOG.md and commit
#   2. git tag v0.2.1
#   3. git push origin v0.2.1
#   4. Wait ~3 minutes -> release appears with 3 binaries + checksums.txt

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed for softprops/action-gh-release

jobs:
  build:
    name: build & release (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: linux,  arch: amd64, ext: "",      asset: ttb-linux-amd64}
          - {os: darwin, arch: arm64, ext: "",      asset: ttb-darwin-arm64}
          - {os: windows, arch: amd64, ext: ".exe", asset: ttb-windows-amd64.exe}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: show go version
        run: go version

      - name: go mod tidy
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: build ${{ matrix.target.os }}/${{ matrix.target.arch }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o "dist/${{ matrix.target.asset }}${{ matrix.target.ext }}" .

      - name: sha256sum
        if: matrix.target.os != 'windows'
        run: |
          cd dist
          sha256sum "${{ matrix.target.asset }}${{ matrix.target.ext }}" > "${{ matrix.target.asset }}.sha256"
          cat "${{ matrix.target.asset }}.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.asset }}
          path: dist/${{ matrix.target.asset }}${{ matrix.target.ext }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: list artifacts
        run: ls -lh artifacts/

      - name: build checksums
        working-directory: artifacts
        run: |
          sha256sum ttb-linux-amd64 ttb-darwin-arm64 ttb-windows-amd64.exe > checksums.txt
          cat checksums.txt

      - name: create release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/ttb-linux-amd64
            artifacts/ttb-darwin-arm64
            artifacts/ttb-windows-amd64.exe
            artifacts/checksums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
